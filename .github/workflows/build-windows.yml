name: Build Windows app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build HumanTyper.exe
        run: dotnet build windows/HumanTyper.csproj -c Release -o out

      - name: Upload build
        uses: actions/upload-artifact@v5
        with:
          name: HumanTyper-windows
          path: out/HumanTyper.exe

      - name: Publish as latest release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 || \
            gh release create latest --title "Human Typer (latest Windows build)" --notes "Download HumanTyper.exe and double-click it."
          gh release upload latest out/HumanTyper.exe --clobber
