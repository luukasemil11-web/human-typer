name: Build Windows app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build HumanTyper.exe
        run: dotnet build windows/HumanTyper.csproj -c Release -o out

      - name: Zip it
        shell: pwsh
        run: Compress-Archive -Path out/HumanTyper.exe -DestinationPath HumanTyper-windows.zip -CompressionLevel Optimal

      - name: Upload build
        uses: actions/upload-artifact@v5
        with:
          name: HumanTyper-windows
          path: HumanTyper-windows.zip

      - name: Publish as latest release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 || \
            gh release create latest --title "Human Typer (latest Windows build)" --notes "Download HumanTyper-windows.zip, unzip it, and double-click HumanTyper.exe."
          gh release delete-asset latest HumanTyper.exe -y 2>/dev/null || true
          gh release upload latest HumanTyper-windows.zip --clobber
